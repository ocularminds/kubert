plugins {
    id 'application'
    id 'jacoco'
    id 'java'
}

group = 'io.github.ocularminds'
version = '0.3.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('io.netty:netty-bom:4.1.137.Final')
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.2'
    implementation('io.fabric8:kubernetes-client:7.8.0') {
        exclude group: 'io.fabric8', module: 'kubernetes-httpclient-vertx'
    }
    runtimeOnly 'io.fabric8:kubernetes-httpclient-jdk:7.8.0'

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'io.fabric8:kubernetes-server-mock:7.8.0'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyLocking {
    lockAllConfigurations()
}

application {
    mainClass = 'io.github.ocularminds.blazra.BlazraApplication'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat = 'full'
    }
}

jacoco {
    toolVersion = '0.8.15'
}

jacocoTestReport {
    dependsOn test
    reports {
        html.required = true
        xml.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.90
            }
            limit {
                counter = 'BRANCH'
                minimum = 0.80
            }
        }
    }
}

check.dependsOn jacocoTestReport, jacocoTestCoverageVerification

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register('resolveRuntimeDependencies') {
    group = 'build setup'
    description = 'Resolves runtime artifacts for an offline application build.'
    notCompatibleWithConfigurationCache('This task intentionally resolves a configuration.')
    doLast {
        configurations.runtimeClasspath.resolve()
    }
}
