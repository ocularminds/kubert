name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish without moving it
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish image, chart, and release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: release
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      GHCR_IMAGE: ghcr.io/${{ github.repository }}
      DOCKERHUB_IMAGE: docker.io/speedoo/kubert
      GAR_REGISTRY: ${{ vars.GAR_REGISTRY }}
      GAR_IMAGE: ${{ vars.GAR_REGISTRY }}/${{ vars.GAR_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/kubert
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
      ACR_IMAGE: ${{ vars.ACR_LOGIN_SERVER }}/kubert
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Resolve immutable release source
        id: release-source
        run: |
          set -euo pipefail
          tag_revision="$(git rev-list -n 1 "${RELEASE_TAG}")"
          head_revision="$(git rev-parse HEAD)"
          test "${tag_revision}" = "${head_revision}"
          echo "revision=${head_revision}" >> "${GITHUB_OUTPUT}"

      - name: Verify release and registry configuration
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GAR_REGISTRY: ${{ vars.GAR_REGISTRY }}
          GAR_PROJECT_ID: ${{ vars.GAR_PROJECT_ID }}
          GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: scripts/verify-release-config.sh

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Authenticate to Google Cloud with OIDC
        if: ${{ env.GAR_REGISTRY != '' }}
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: access_token
          create_credentials_file: false
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Log in to Google Artifact Registry
        if: ${{ env.GAR_REGISTRY != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.GAR_REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.google-auth.outputs.access_token }}

      - name: Authenticate to Azure with OIDC
        if: ${{ env.ACR_LOGIN_SERVER != '' }}
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        if: ${{ env.ACR_LOGIN_SERVER != '' }}
        run: az acr login --name "${ACR_LOGIN_SERVER%%.*}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Select image destinations
        id: destinations
        run: |
          set -euo pipefail
          {
            echo 'images<<BLAZRA_IMAGES'
            echo "${GHCR_IMAGE}"
            echo "${DOCKERHUB_IMAGE}"
            if [[ -n "${GAR_REGISTRY}" ]]; then
              echo "${GAR_IMAGE}"
            fi
            if [[ -n "${ACR_LOGIN_SERVER}" ]]; then
              echo "${ACR_IMAGE}"
            fi
            echo 'BLAZRA_IMAGES'
          } >> "${GITHUB_OUTPUT}"

      - name: Create image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.destinations.outputs.images }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.revision=${{ steps.release-source.outputs.revision }}

      - name: Build and publish multi-registry image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            REVISION=${{ steps.release-source.outputs.revision }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v4.2.0

      - name: Package and publish chart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          helm package charts/blazra --destination dist
          printf '%s' "${GHCR_TOKEN}" | helm registry login ghcr.io \
            --username "${GITHUB_ACTOR}" \
            --password-stdin
          helm push dist/blazra-*.tgz oci://ghcr.io/ocularminds/charts

      - name: Create release assets
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "Kubert ${RELEASE_TAG} container images"
            echo
            echo "All registry references use multi-architecture manifest ${IMAGE_DIGEST}."
            echo
            echo "${GHCR_IMAGE}:${RELEASE_TAG#v}"
            echo "${DOCKERHUB_IMAGE}:${RELEASE_TAG#v}"
            if [[ -n "${GAR_REGISTRY}" ]]; then
              echo "${GAR_IMAGE}:${RELEASE_TAG#v}"
            fi
            if [[ -n "${ACR_LOGIN_SERVER}" ]]; then
              echo "${ACR_IMAGE}:${RELEASE_TAG#v}"
            fi
          } > dist/IMAGES.txt
          (
            cd dist
            sha256sum blazra-*.tgz IMAGES.txt > SHA256SUMS
          )

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* --clobber
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --generate-notes \
              --title "Kubert ${RELEASE_TAG#v}" \
              --verify-tag
          fi
