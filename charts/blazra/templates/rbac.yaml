{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "blazra.fullname" . }}
  labels:
    {{- include "blazra.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - {{ include "blazra.fullname" . }}
    verbs:
      - get
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "blazra.fullname" . }}
  labels:
    {{- include "blazra.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "blazra.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "blazra.fullname" . }}
{{- end }}
