apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "blazra.fullname" . }}
  labels:
    {{- include "blazra.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.workload.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "blazra.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- include "blazra.podAnnotations" . | nindent 8 }}
      labels:
        {{- include "blazra.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "blazra.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: blazra
          image: {{ include "blazra.sidecarImage" . | quote }}
          imagePullPolicy: {{ .Values.blazra.image.pullPolicy }}
          restartPolicy: Always
          env:
            - name: BLAZRA_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: BLAZRA_DEPLOYMENT
              value: {{ include "blazra.fullname" . | quote }}
            - name: BLAZRA_CONTAINER
              value: {{ .Values.workload.containerName | quote }}
            - name: BLAZRA_POLL_INTERVAL
              value: {{ .Values.blazra.pollInterval | quote }}
            - name: BLAZRA_UPDATE_POLICY
              value: {{ .Values.blazra.updatePolicy | quote }}
            - name: BLAZRA_CONNECT_TIMEOUT
              value: {{ .Values.blazra.connectTimeout | quote }}
            - name: BLAZRA_REQUEST_TIMEOUT
              value: {{ .Values.blazra.requestTimeout | quote }}
            - name: BLAZRA_DRY_RUN
              value: {{ .Values.blazra.dryRun | quote }}
            {{- with .Values.blazra.registryCredentials.existingSecret }}
            - name: DOCKER_HUB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.blazra.registryCredentials.usernameKey | quote }}
            - name: DOCKER_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.blazra.registryCredentials.tokenKey | quote }}
            {{- end }}
            {{- with .Values.blazra.ociRegistryCredentials.existingSecret }}
            - name: BLAZRA_OCI_REGISTRY_CONFIG_PATH
              value: /var/run/secrets/blazra/registry/config.json
            {{- end }}
          securityContext:
            {{- toYaml .Values.blazra.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.blazra.resources | nindent 12 }}
          volumeMounts:
            - name: kubernetes-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            {{- with .Values.blazra.ociRegistryCredentials.existingSecret }}
            - name: oci-registry-credentials
              mountPath: /var/run/secrets/blazra/registry
              readOnly: true
            {{- end }}
      containers:
        - name: {{ .Values.workload.containerName }}
          image: {{ include "blazra.workloadImage" . | quote }}
          imagePullPolicy: {{ .Values.workload.image.pullPolicy }}
          {{- with .Values.workload.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.workload.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.workload.ports }}
          ports:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.workload.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.workload.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.workload.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: kubernetes-api-access
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  expirationSeconds: 3600
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        {{- with .Values.blazra.ociRegistryCredentials.existingSecret }}
        - name: oci-registry-credentials
          secret:
            secretName: {{ . | quote }}
            defaultMode: 0444
            items:
              - key: {{ $.Values.blazra.ociRegistryCredentials.configKey | quote }}
                path: config.json
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
