{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubert.fullname" . }}
  labels:
    {{- include "kubert.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: app
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
  selector:
    {{- include "kubert.selectorLabels" . | nindent 4 }}
{{- end }}
